<div class="min-h-screen flex flex-col">
  <header class="bg-brand-600 text-white shadow-sm">
    <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
      <a routerLink="/" class="text-lg font-semibold tracking-tight">Studia</a>

      @if (auth.isLoggedIn()) {
        <nav class="flex items-center gap-4 text-sm">
          <span class="hidden sm:inline text-brand-100">{{ auth.currentUser()?.email }}</span>
          <span class="rounded-full bg-brand-700 px-2.5 py-1 text-xs font-medium">
            {{ auth.role() }}
          </span>
          <button
            type="button"
            (click)="logout()"
            class="rounded-md bg-white/10 px-3 py-1.5 font-medium hover:bg-white/20 transition-colors"
          >
            Cerrar sesión
          </button>
        </nav>
      }
    </div>
  </header>

  <div class="flex min-h-0 flex-1">
    @if (auth.isLoggedIn()) {
      <app-sidebar class="hidden md:block" />
    }

    <main class="min-w-0 flex-1 overflow-y-auto bg-gray-50">
      <router-outlet />
    </main>
  </div>
</div>
