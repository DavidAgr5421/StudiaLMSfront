<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    title="Notificaciones"
    class="relative inline-flex shrink-0 rounded-md p-2 text-white/90 transition-all duration-150 hover:bg-white/10 hover:text-white active:scale-95"
  >
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"
      />
    </svg>
    @if (unreadCount() > 0) {
      <span class="absolute right-1 top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-semibold leading-none text-white">
        {{ unreadCount() > 9 ? '9+' : unreadCount() }}
      </span>
    }
  </button>

  @if (isOpen()) {
    <div class="animate-fade-in-down absolute right-0 top-full z-20 mt-2 w-80 overflow-hidden rounded-xl border border-gray-100 bg-white text-left shadow-xl dark:border-gray-700 dark:bg-gray-900">
      <div class="border-b border-gray-100 px-4 py-2.5 dark:border-gray-800">
        <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">Notificaciones</p>
      </div>

      @if (notifications().length === 0) {
        <p class="px-4 py-6 text-center text-sm text-gray-400">No tenés notificaciones.</p>
      } @else {
        <ul class="max-h-96 divide-y divide-gray-50 overflow-auto dark:divide-gray-800">
          @for (notification of notifications(); track notification.id) {
            <li>
              <button
                type="button"
                (click)="select(notification)"
                class="block w-full px-4 py-3 text-left transition-colors hover:bg-gray-50 dark:hover:bg-gray-800"
                [class.bg-brand-50/50]="!notification.readAtUtc"
                [class.dark:bg-brand-950/30]="!notification.readAtUtc"
              >
                <div class="flex items-start gap-2">
                  @if (!notification.readAtUtc) {
                    <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-brand-600"></span>
                  }
                  <div class="min-w-0 flex-1">
                    <p class="truncate text-sm font-medium text-gray-900 dark:text-gray-100">{{ notification.title }}</p>
                    <p class="mt-0.5 text-xs text-gray-600 dark:text-gray-400">{{ notification.message }}</p>
                    <p class="mt-1 text-[11px] text-gray-400">{{ notification.createdAtUtc | date: 'medium' }}</p>
                  </div>
                </div>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
