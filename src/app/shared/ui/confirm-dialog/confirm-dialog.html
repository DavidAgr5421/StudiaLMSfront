<div class="animate-fade-in fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 px-4 backdrop-blur-[2px]">
  <div class="animate-pop-in w-full max-w-sm rounded-xl bg-white p-6 shadow-2xl">
    <div class="flex h-11 w-11 items-center justify-center rounded-full bg-red-50">
      <svg class="h-5 w-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    </div>
    <h2 class="mt-3 text-lg font-semibold text-gray-900">{{ title() }}</h2>
    <p class="mt-2 text-sm text-gray-600">{{ message() }}</p>

    @if (errorMessage()) {
      <p class="animate-fade-in-down mt-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
    }

    <div class="mt-6 flex justify-end gap-2">
      <button type="button" [disabled]="isProcessing()" (click)="cancelled.emit()" class="btn-ghost">
        {{ cancelLabel() }}
      </button>
      <button type="button" [disabled]="isProcessing()" (click)="confirmed.emit()" class="btn-danger">
        @if (isProcessing()) {
          <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
        }
        {{ isProcessing() ? 'Eliminando…' : confirmLabel() }}
      </button>
    </div>
  </div>
</div>
