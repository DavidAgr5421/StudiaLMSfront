<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
  <div class="w-full max-w-sm rounded-xl bg-white p-6 shadow-xl">
    <h2 class="text-lg font-semibold text-gray-900">{{ title() }}</h2>
    <p class="mt-2 text-sm text-gray-600">{{ message() }}</p>

    @if (errorMessage()) {
      <p class="mt-3 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
    }

    <div class="mt-6 flex justify-end gap-2">
      <button
        type="button"
        [disabled]="isProcessing()"
        (click)="cancelled.emit()"
        class="rounded-md px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 disabled:opacity-60"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        [disabled]="isProcessing()"
        (click)="confirmed.emit()"
        class="rounded-md bg-red-600 px-3 py-2 text-sm font-medium text-white hover:bg-red-700 disabled:opacity-60"
      >
        {{ isProcessing() ? 'Eliminando…' : confirmLabel() }}
      </button>
    </div>
  </div>
</div>
